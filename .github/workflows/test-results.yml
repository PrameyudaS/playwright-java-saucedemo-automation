name: UI and API Tests

on:
  push:
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run UI Tests
        run: mvn clean test

      - name: Generate UI Allure Report
        if: always()
        run: mvn io.qameta.allure:allure-maven:report

      - name: Upload UI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-report
          path: ui-tests/target/site/allure-maven-plugin

  api-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run API Tests
        env:
          GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}
        run: mvn clean test

      - name: Generate API Allure Report
        if: always()
        run: mvn io.qameta.allure:allure-maven:report

      - name: Upload API Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: api-tests/target/site/allure-maven-plugin

  publish-report:
    if: always()
    needs: [ ui-tests, api-tests ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Verify downloaded reports
        run: |
          find reports -maxdepth 3 -type f | sort
          test -f reports/ui-allure-report/index.html
          test -f reports/api-allure-report/index.html

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site/ui-report site/api-report
          cp -R reports/ui-allure-report/. site/ui-report/
          cp -R reports/api-allure-report/. site/api-report/

      - name: Verify GitHub Pages site
        run: |
          test -f site/ui-report/index.html
          test -f site/api-report/index.html
          find site -maxdepth 2 -type f | sort

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site