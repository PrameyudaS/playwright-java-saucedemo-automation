name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/java:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ui-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ui-tests/pom.xml

      - name: Compile UI test project
        run: mvn --batch-mode --no-transfer-progress clean test-compile

      - name: Install Chromium system dependencies
        run: >
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install-deps chromium"

      - name: Install Chromium browser
        run: >
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install chromium"

      - name: Run UI test suite
        run: mvn --batch-mode --no-transfer-progress test -Dheadless=true

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ui-tests/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api-tests

    env:
      GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-tests/pom.xml

      - name: Verify API token is configured
        shell: bash
        run: |
          if [ -z "$GOREST_API_TOKEN" ]; then
            echo "GOREST_API_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Run API test suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            api-tests/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
