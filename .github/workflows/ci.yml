name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ui-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn --batch-mode --no-transfer-progress install -DskipTests

      - name: Install Chromium and operating-system dependencies
        run: |
          sudo --preserve-env=PATH mvn --batch-mode --no-transfer-progress \
            exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"

      - name: Run UI tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Generate UI Allure report
        if: always()
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Upload UI Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-report
          path: ui-tests/target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: ui-tests/target/allure-results/
          if-no-files-found: warn
          retention-days: 14

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api-tests

    env:
      GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-tests/pom.xml

      - name: Verify API token is configured
        shell: bash
        run: |
          if [ -z "$GOREST_API_TOKEN" ]; then
            echo "GOREST_API_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Run API test suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            api-tests/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
